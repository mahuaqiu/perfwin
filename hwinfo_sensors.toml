# HWiNFO 传感器名称映射配置
# 用于从 HWiNFO 共享内存中匹配对应的传感器数据

[cpu]
# 系统CPU使用率
usage_name = "Total CPU Usage"
usage_unit = "%"

# CPU温度
temperature_name = "CPU Package"
temperature_unit = "C"

# CPU功耗
power_name = "CPU Package Power"
power_unit = "W"

# CPU核心频率（正则匹配所有核心时钟，求平均）
clock_pattern = "(Core [0-9]+ Clock|P-core [0-9]+ Clock|E-core [0-9]+ Clock)"
clock_unit = "MHz"

[gpu]
# 系统GPU使用率
usage_name = "GPU D3D Usage"
usage_unit = "%"

# GPU温度
temperature_name = "GPU Temperature"
temperature_unit = "C"

# GPU功耗
power_name = "GPU Power"
power_unit = "W"

[system]
# 系统总功耗（部分系统可能没有此传感器）
power_name = "Total System Power"
power_unit = "W"

[network]
# 下载速度
download_name = "Current DL rate"
download_unit = "KB/s"

# 上传速度
upload_name = "Current UP rate"
upload_unit = "KB/s"

[battery]
# 电池电量（笔记本电脑）
charge_name = "Charge Level"
charge_unit = "%"